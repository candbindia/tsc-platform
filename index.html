<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology Spearheads Committee — Login</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand-logo large" style="margin-bottom:24px;">
      <span class="bar"></span>
      <span class="brand-mark">C&amp;B</span>
    </div>
    <h1>Technology Spearheads Committee</h1>
    <p class="subtitle">Consulting &amp; Beyond</p>

    <div class="tabs">
      <div class="tab active" id="tabEmployee" onclick="showTab('employee')">Employee</div>
      <div class="tab" id="tabStaff" onclick="showTab('staff')">Committee / Management</div>
    </div>

    <!-- EMPLOYEE FLOW -->
    <div id="employeePanel">
      <form id="empStep1" onsubmit="return handleFormSubmit(event, checkEmployeeId);">
        <div class="step-icon" id="iconStep1"></div>
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" placeholder="e.g. CB1102" autocomplete="off" autofocus>
        <button type="submit">Continue</button>
      </form>

      <form id="empStepLogin" class="hidden" onsubmit="return handleFormSubmit(event, employeeLoginSubmit);">
        <div class="step-icon" id="iconStepLogin"></div>
        <p id="empLoginGreeting" class="subtitle" style="text-align:center;"></p>
        <label for="empLoginPassword">Password</label>
        <input type="password" id="empLoginPassword">
        <button type="submit">Log in</button>
        <button type="button" class="secondary" onclick="backToStep1()">Back</button>
      </form>

      <form id="empStepRegister" class="hidden" onsubmit="return handleFormSubmit(event, requestCodeSubmit);">
        <div class="step-icon" id="iconStepRegister"></div>
        <p class="subtitle" style="text-align:center;">First visit! To make sure it's really you, we'll email a 6-digit code to the work email HR has on file for your Employee ID.</p>
        <button type="submit">Email me a code</button>
        <button type="button" class="secondary" onclick="backToStep1()">Back</button>
      </form>

      <form id="empStepVerify" class="hidden" onsubmit="return handleFormSubmit(event, employeeRegisterSubmit);">
        <div class="step-icon" id="iconStepVerify"></div>
        <p id="empVerifyGreeting" class="subtitle" style="text-align:center;"></p>
        <label for="empCode">6-digit code</label>
        <input type="text" id="empCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
        <label for="empNewPassword">Create a password</label>
        <input type="password" id="empNewPassword" autocomplete="new-password" placeholder="At least 8 characters">
        <label for="empConfirmPassword">Confirm password</label>
        <input type="password" id="empConfirmPassword" autocomplete="new-password">
        <button type="submit">Set password &amp; continue</button>
        <button type="button" class="secondary" onclick="resendCode(this)">Send a new code</button>
        <button type="button" class="secondary" onclick="backToStep1()">Back</button>
      </form>
    </div>

    <!-- STAFF FLOW -->
    <form id="staffPanel" class="hidden" onsubmit="return handleFormSubmit(event, staffLoginSubmit);">
      <div class="step-icon" id="iconStaff"></div>
      <label for="staffEmail">Office email</label>
      <input type="email" id="staffEmail" autocomplete="off">
      <label for="staffPassword">Password</label>
      <input type="password" id="staffPassword">
      <button type="submit">Log in</button>
    </form>

    <div id="messageBox"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="toast.js"></script>
<script>
  document.getElementById("iconStep1").innerHTML = icon("user", 24);
  document.getElementById("iconStepLogin").innerHTML = icon("key", 24);
  document.getElementById("iconStepRegister").innerHTML = icon("mail", 24);
  document.getElementById("iconStepVerify").innerHTML = icon("key", 24);
  document.getElementById("iconStaff").innerHTML = icon("log-in", 24);

  let currentEmployeeId = null;
  let currentTicket = null;

  function showTab(which) {
    document.getElementById("tabEmployee").classList.toggle("active", which === "employee");
    document.getElementById("tabStaff").classList.toggle("active", which === "staff");
    document.getElementById("employeePanel").classList.toggle("hidden", which !== "employee");
    document.getElementById("staffPanel").classList.toggle("hidden", which !== "staff");
    clearMessage();
  }

  function showError(msg) {
    document.getElementById("messageBox").innerHTML = '<div class="error"></div>';
    document.querySelector("#messageBox .error").textContent = msg;
  }

  function clearMessage() {
    document.getElementById("messageBox").innerHTML = "";
  }

  function backToStep1() {
    document.getElementById("empStep1").classList.remove("hidden");
    document.getElementById("empStepLogin").classList.add("hidden");
    document.getElementById("empStepRegister").classList.add("hidden");
    document.getElementById("empStepVerify").classList.add("hidden");
    currentTicket = null;
    clearMessage();
  }

  async function checkEmployeeId() {
    clearMessage();
    const employeeId = document.getElementById("employeeId").value.trim();
    if (!employeeId) return showError("Enter your Employee ID.");

    try {
      const res = await fetch(API_BASE + "/auth/employee/check-id", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employeeId }),
      });
      const data = await res.json();

      if (!res.ok) return showError(data.error || "Something went wrong.");
      if (!data.valid) {
        return showError("Employee ID not recognized or not active. Contact HR if this seems wrong.");
      }

      currentEmployeeId = employeeId;
      document.getElementById("empStep1").classList.add("hidden");

      if (data.hasPassword) {
        document.getElementById("empLoginGreeting").textContent = "Welcome back. Enter your password to continue.";
        document.getElementById("empStepLogin").classList.remove("hidden");
        document.getElementById("empLoginPassword").focus();
      } else {
        document.getElementById("empStepRegister").classList.remove("hidden");
      }
    } catch (err) {
      showError("Couldn't reach the server. Try again in a moment.");
    }
  }

  async function employeeLoginSubmit() {
    clearMessage();
    const password = document.getElementById("empLoginPassword").value;
    if (!password) return showError("Enter your password.");

    try {
      const res = await fetch(API_BASE + "/auth/employee/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employeeId: currentEmployeeId, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || "Login failed.");

      saveSession(data);
      redirectAfterLogin(data);
    } catch (err) {
      showError("Couldn't reach the server. Try again in a moment.");
    }
  }

  async function sendCode() {
    const res = await fetch(API_BASE + "/auth/employee/request-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employeeId: currentEmployeeId }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || "Couldn't send the code.");
      return false;
    }
    currentTicket = data.ticket;
    document.getElementById("empVerifyGreeting").textContent =
      "We sent a code to " + data.maskedEmail + ". It's valid for " + data.expiresInMinutes + " minutes.";
    document.getElementById("empStepRegister").classList.add("hidden");
    document.getElementById("empStepVerify").classList.remove("hidden");
    document.getElementById("empCode").focus();
    return true;
  }

  async function requestCodeSubmit() {
    clearMessage();
    try {
      await sendCode();
    } catch (err) {
      showError("Couldn't reach the server. Try again in a moment.");
    }
  }

  function resendCode(btn) {
    clearMessage();
    handleClick(btn, async function () {
      try {
        if (await sendCode()) showToast("New code sent.", "success");
      } catch (err) {
        showError("Couldn't reach the server. Try again in a moment.");
      }
    });
  }

  async function employeeRegisterSubmit() {
    clearMessage();
    const code = document.getElementById("empCode").value.trim();
    const password = document.getElementById("empNewPassword").value;
    const confirm = document.getElementById("empConfirmPassword").value;
    if (!/^\d{6}$/.test(code)) return showError("Enter the 6-digit code from your email.");
    if (!password || password.length < 8) return showError("Password must be at least 8 characters.");
    if (password !== confirm) return showError("Passwords don't match.");

    try {
      const res = await fetch(API_BASE + "/auth/employee/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employeeId: currentEmployeeId, ticket: currentTicket, code, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || "Couldn't set password.");

      saveSession(data);
      redirectAfterLogin(data);
    } catch (err) {
      showError("Couldn't reach the server. Try again in a moment.");
    }
  }

  async function staffLoginSubmit() {
    clearMessage();
    const email = document.getElementById("staffEmail").value.trim();
    const password = document.getElementById("staffPassword").value;
    if (!email || !password) return showError("Enter both email and password.");

    try {
      const res = await fetch(API_BASE + "/auth/staff/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || "Login failed.");

      saveSession(data);
      redirectAfterLogin(data);
    } catch (err) {
      showError("Couldn't reach the server. Try again in a moment.");
    }
  }

  // If already logged in, skip straight past the login page.
  (function () {
    const existing = getSession();
    if (existing && existing.token) redirectAfterLogin(existing);
  })();
</script>
</body>
</html>
