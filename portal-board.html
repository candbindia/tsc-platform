<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Board — TSC</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="content">
  <h1>Requirement Board</h1>
  <p class="subtitle">What's already been requested, and where each one stands — check here before submitting something that may already be in motion.</p>

  <div id="list"></div>
  <div id="messageBox"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
  async function load() {
    const session = renderTopbar();
    if (!session) return;

    try {
      const data = await apiFetch("/board");
      renderList(data.items || []);
    } catch (err) {
      document.getElementById("messageBox").innerHTML = '<div class="error">' + escapeHtml(err.message) + "</div>";
    }
  }

  function renderList(items) {
    if (!items.length) {
      document.getElementById("list").innerHTML = '<p class="subtitle">Nothing on the board yet.</p>';
      return;
    }

    let html =
      "<table><tr><th>Requirement</th><th>Department</th><th>Status</th><th>Priority</th><th>Timeline</th></tr>";
    items.forEach((it) => {
      html +=
        "<tr><td>" +
        escapeHtml(it["Requirement Name / Short Description"]) +
        "</td><td>" +
        escapeHtml(it["Department"]) +
        '</td><td><span class="badge">' +
        escapeHtml(it["Status"]) +
        "</span></td><td>" +
        escapeHtml(it["Priority Classification"]) +
        "</td><td>" +
        escapeHtml(it["Expected Timeline"]) +
        "</td></tr>";
    });
    html += "</table>";
    document.getElementById("list").innerHTML = html;
  }

  load();
</script>
</body>
</html>
