<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Board — TSC</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="content">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
    <div class="ic" id="icHeader" style="width:36px; height:36px;"></div>
    <h1 style="margin:0;">Requirement Board</h1>
  </div>
  <p class="subtitle">Every requirement and where it stands. Scroll sideways to see every column.</p>

  <div id="list"></div>
  <div id="messageBox"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="status.js"></script>
<script src="nav.js"></script>
<script>
  const session = renderTopbar();
  document.getElementById("icHeader").innerHTML = icon("kanban", 20);

  async function load() {
    if (!guardRoles(session, ["Committee", "Management"])) return;
    try {
      const data = await apiFetch("/board");
      renderBoard(data.items || []);
    } catch (err) {
      document.getElementById("messageBox").innerHTML = '<div class="error"></div>';
      document.getElementById("messageBox").firstChild.textContent = err.message;
    }
  }

  function renderBoard(items) {
    if (!items.length) {
      document.getElementById("list").innerHTML = '<p class="subtitle">Nothing has been submitted yet.</p>';
      return;
    }
    const groups = {};
    items.forEach((it) => { const s = (it["Status"] || "").trim() || "Unspecified"; (groups[s] = groups[s] || []).push(it); });
    const order = STATUS_ORDER.filter((s) => groups[s]).concat(Object.keys(groups).filter((s) => !STATUS_META[s]).sort());

    let html = '<div class="kanban">';
    order.forEach((status) => {
      html += '<div class="kanban-col"><div class="kanban-col-head"><span class="title">' + escapeHtml(status) + '</span><span class="count">' + groups[status].length + '</span></div><div class="kanban-col-body">';
      groups[status].forEach((it) => {
        html += '<a class="kanban-card" style="display:block; text-decoration:none; color:inherit;" href="tracker-home.html?id=' + encodeURIComponent(it["Requirement ID"]) + '">' +
          '<div class="k-title">' + escapeHtml(it["Automation Name"] || it["Requirement ID"]) + "</div>" +
          '<div class="subtitle" style="margin:0; font-size:12px;">' + escapeHtml(it["Process Explanation"]) + "</div>" +
          '<div class="subtitle" style="margin:4px 0 0; font-size:12px;">' + icon("building", 10) + " " + escapeHtml(it["Department"] || "") + " · " + escapeHtml(it["Submitted By"] || "") + "</div>" +
          '<div class="k-meta"><span>' + escapeHtml(it["Priority Classification"] || "—") + "</span><span>" + escapeHtml(it["Requirement ID"]) + "</span></div></a>";
      });
      html += "</div></div>";
    });
    document.getElementById("list").innerHTML = html + "</div>";
  }

  load();
</script>
</body>
</html>
