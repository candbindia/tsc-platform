<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Register — TSC Tracker</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page wide">
  <h1>Requirement Register</h1>
  <p class="subtitle">Every requirement submitted, with its current status. Committee members can act on items below; Management and Admin have view access.</p>

  <div id="list"></div>
  <div id="messageBox"></div>
</div>

<!-- Action panel (reject / assign for scoring / validate score / validate completion) -->
<div class="page hidden" id="actionPanel" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); margin:0; max-width:none; display:flex; align-items:center; justify-content:center; overflow:auto;">
  <div class="card" style="max-width:480px; width:90%; max-height:85vh; overflow:auto;">
    <h2 id="actionTitle"></h2>
    <div id="actionFields"></div>
    <button onclick="handleClick(this, submitAction)">Confirm</button>
    <button class="secondary" onclick="closeActionPanel()">Cancel</button>
    <div id="actionMessage"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="toast.js"></script>
<script src="status.js"></script>
<script src="nav.js"></script>
<script src="tour.js"></script>
<script>
  let currentReqId = null;
  let currentAction = null;
  let session = null;

  async function load() {
    session = renderTopbar();
    if (!session) return;

    loadEmployeeList();
    try {
      const data = await apiFetch("/tracker/requirements");
      renderList(data.items || []);
    } catch (err) {
      showToast(err.message, "error");
    }

    maybeStartTour(session);
  }

  function renderList(items) {
    if (!items.length) {
      document.getElementById("list").innerHTML = '<p class="subtitle">No requirements submitted yet.</p>';
      return;
    }

    const isCommittee = session.role === "Committee";

    let html = "<table><tr><th>Req ID</th><th>Submitted By</th><th>Dept</th><th>Description</th><th>Status</th><th>Score</th><th>Assigned Owner</th>";
    if (isCommittee) html += "<th>Actions</th>";
    html += "</tr>";

    items.forEach((it) => {
      const reqId = it["Requirement ID"];
      const status = it["Status"];

      html +=
        "<tr><td>" + escapeHtml(reqId) + "</td>" +
        "<td>" + escapeHtml(it["Submitted By"]) + "</td>" +
        "<td>" + escapeHtml(it["Department"]) + "</td>" +
        "<td>" + escapeHtml(it["Process / Activity Description"]) + "</td>" +
        "<td>" + statusBadge(status) + "</td>" +
        "<td>" + (it["Score"] ? escapeHtml(it["Score"]) + " (" + escapeHtml(it["Priority Classification"]) + ")" : "") + "</td>" +
        "<td>" + escapeHtml(it["Assigned Owner"]) + "</td>";

      if (isCommittee) {
        let actions = "";
        if (status === "Submitted" || status === "Under committee review") {
          actions +=
            btn(icon("user-check", 12) + " Assign", "openAssign('" + reqId + "')") +
            btn(icon("x-circle", 12) + " Reject", "openReject('" + reqId + "')");
        } else if (status === "Score submitted") {
          actions += btn(icon("check-circle", 12) + " Validate score", "openValidateScore('" + reqId + "')");
        } else if (status === "Pending validation") {
          actions += btn(icon("check-circle", 12) + " Validate", "openValidateCompletion('" + reqId + "')");
        }
        html += "<td>" + actions + "</td>";
      }
      html += "</tr>";
    });
    html += "</table>";
    document.getElementById("list").innerHTML = html;
  }

  function btn(labelHtml, onclick) {
    // labelHtml may contain an icon() call's output, so it is NOT escaped here —
    // callers only ever pass static text + icon(), never raw user data.
    return '<button style="width:auto; margin:2px; padding:5px 9px; font-size:12px;" onclick="' + onclick + '">' + labelHtml + "</button>";
  }

  function openPanel(title, fieldsHtml, action, reqId) {
    currentAction = action;
    currentReqId = reqId;
    document.getElementById("actionTitle").textContent = title + " — " + reqId;
    document.getElementById("actionFields").innerHTML = fieldsHtml;
    document.getElementById("actionMessage").innerHTML = "";
    document.getElementById("actionPanel").classList.remove("hidden");
  }

  function closeActionPanel() {
    document.getElementById("actionPanel").classList.add("hidden");
  }

  function openReject(reqId) {
    openPanel(
      "Reject requirement",
      '<label for="f_reason">Reason</label><textarea id="f_reason" rows="3"></textarea>',
      "reject",
      reqId
    );
  }

  function openAssign(reqId) {
    openPanel(
      "Assign for scoring",
      '<label for="f_empId">Employee (type an ID or name, then pick)</label><input type="text" id="f_empId" list="empOptions" autocomplete="off" placeholder="e.g. CB1102 or Asha">' +
        '<datalist id="empOptions">' + employeeOptions() + "</datalist>" +
        '<p class="subtitle" style="margin:6px 0 0;">They are notified at their work email on file.</p>',
      "assign_for_scoring",
      reqId
    );
  }

  function openValidateScore(reqId) {
    openPanel(
      "Validate score",
      '<label for="f_deadline">Deadline (optional)</label><input type="date" id="f_deadline">',
      "validate_score",
      reqId
    );
  }

  function openValidateCompletion(reqId) {
    openPanel(
      "Validate completion",
      '<p class="subtitle">This marks the item Live and adds it to the Requirement Board.</p>' +
        '<label style="display:flex; align-items:center; gap:8px; margin-top:12px;"><input type="checkbox" id="f_publish" style="width:auto; margin:0;" onchange="toggleCatalogFields()"> Also list it in the Automation Catalog</label>' +
        '<div id="catalogFields" class="hidden">' +
        '<label for="f_cname">Automation name</label><input type="text" id="f_cname">' +
        '<label for="f_cdesc">Short description</label><textarea id="f_cdesc" rows="2"></textarea>' +
        '<label for="f_ctype">Access type</label><select id="f_ctype" onchange="toggleCatalogFields()"><option value="Open">Open — people can use the link directly</option><option value="On Request">On Request — routed to the owner</option></select>' +
        '<div id="f_linkWrap"><label for="f_clink">Access link / instructions</label><input type="text" id="f_clink"></div>' +
        '<div id="f_ownerWrap" class="hidden"><label for="f_cowner">Owner email (requests go here)</label><input type="email" id="f_cowner"></div>' +
        "</div>",
      "validate_completion",
      reqId
    );
  }

  function toggleCatalogFields() {
    const on = document.getElementById("f_publish").checked;
    document.getElementById("catalogFields").classList.toggle("hidden", !on);
    const open = document.getElementById("f_ctype").value === "Open";
    document.getElementById("f_linkWrap").classList.toggle("hidden", !open);
    document.getElementById("f_ownerWrap").classList.toggle("hidden", open);
  }

  let employeeList = [];
  function employeeOptions() {
    return employeeList
      .map((e) => '<option value="' + escapeHtml(e.employeeId) + '">' + escapeHtml(e.name + " — " + e.department) + "</option>")
      .join("");
  }

  async function loadEmployeeList() {
    if (session.role !== "Committee") return;
    try {
      const data = await apiFetch("/tracker/employees");
      employeeList = data.employees || [];
    } catch (err) {
      /* autocomplete is a convenience; typing an ID still works */
    }
  }

  async function submitAction() {
    const payload = { requirementId: currentReqId, action: currentAction };

    if (currentAction === "reject") {
      payload.rejectionReason = document.getElementById("f_reason").value.trim();
    } else if (currentAction === "assign_for_scoring") {
      payload.assignedEmployeeId = document.getElementById("f_empId").value.trim();
      if (!payload.assignedEmployeeId) {
        document.getElementById("actionMessage").innerHTML = '<div class="error">Employee ID is required.</div>';
        return;
      }
    } else if (currentAction === "validate_score") {
      payload.deadline = document.getElementById("f_deadline").value;
    } else if (currentAction === "validate_completion" && document.getElementById("f_publish").checked) {
      const type = document.getElementById("f_ctype").value;
      payload.publishToCatalog = true;
      payload.catalog = {
        name: document.getElementById("f_cname").value.trim(),
        description: document.getElementById("f_cdesc").value.trim(),
        accessType: type,
        accessLink: type === "Open" ? document.getElementById("f_clink").value.trim() : "",
        owner: type === "On Request" ? document.getElementById("f_cowner").value.trim() : "",
      };
    }

    try {
      const data = await apiFetch("/tracker/requirements/review", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      closeActionPanel();
      let note = "";
      if (currentAction === "assign_for_scoring") {
        note = data.notified ? " — " + data.assignedOwner + " was emailed." : " — no email sent (no work email on file for them).";
      } else if (data.catalogId) {
        note = " — added to the Catalog.";
      }
      showToast("Updated: " + data.status + note, "success");
      load();
    } catch (err) {
      document.getElementById("actionMessage").innerHTML = '<div class="error">' + escapeHtml(err.message) + "</div>";
    }
  }

  load();
</script>
</body>
</html>
