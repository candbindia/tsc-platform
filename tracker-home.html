<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Register — TSC</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="page wide" style="max-width:1240px;">
  <h1>Requirement Register</h1>
  <p class="subtitle" id="regSub"></p>

  <div class="filter-row">
    <input type="text" id="fSearch" placeholder="Search ID, name, department, text…" oninput="renderList()">
    <select id="fStatus" onchange="renderList()"><option value="">All statuses</option></select>
    <select id="fMine" onchange="renderList()"><option value="">Everyone's</option><option value="mine">Waiting on the Committee</option></select>
  </div>
  <div class="table-wrap" id="list"></div>
  <div id="messageBox"></div>
</div>

<div class="modal-overlay hidden" id="detailPanel">
  <div class="card xl-modal">
    <div id="detailBody"><p class="subtitle">Loading…</p></div>
    <button class="secondary no-print" onclick="closeDetail()" style="margin-top:14px;">Close</button>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="toast.js"></script>
<script src="status.js"></script>
<script src="nav.js"></script>
<script src="tour.js"></script>
<script>
  let session = null, items = [], D = null, currentId = null, departments = [];
  const COMMITTEE_WAITING = ["Submitted", "Under committee review", "Scoring", "Score confirmed", "RUD draft", "RUD signed off", "Publishing"];
  const isCommittee = () => session && session.role === "Committee";
  const nl = (t) => escapeHtml(t).replace(/\n/g, "<br>");
  const short = (t, n) => { t = (t || "").toString(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
  const post = (path, body) => apiFetch(path, { method: "POST", body: JSON.stringify(body) });
  function showErr(id, m) { const el = document.getElementById(id); if (el) { el.innerHTML = '<div class="error"></div>'; el.firstChild.textContent = m; } else showToast(m, "error"); }

  async function load() {
    session = renderTopbar();
    if (!guardRoles(session, ["Committee", "Management"])) return;
    document.getElementById("regSub").textContent = isCommittee()
      ? "Every requirement and where it stands. Open one to review, score, write the document, build and publish."
      : "Every requirement and where it stands. You can read everything and leave team-only notes for the Committee.";
    const sel = document.getElementById("fStatus");
    STATUS_ORDER.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o); });
    try {
      items = (await apiFetch("/tracker/requirements")).items || [];
      renderList();
    } catch (err) { showToast(err.message, "error"); }
    const want = new URLSearchParams(location.search).get("id");
    if (want) openDetail(want);
    maybeStartTour(session);
  }

  function renderList() {
    const q = document.getElementById("fSearch").value.trim().toLowerCase();
    const st = document.getElementById("fStatus").value;
    const waiting = document.getElementById("fMine").value === "mine";
    const rows = items.filter((it) =>
      (!st || it["Status"] === st) && (!waiting || COMMITTEE_WAITING.includes(it["Status"])) &&
      (!q || [it["Requirement ID"], it["Submitted By"], it["Department"], it["Process Explanation"], it["Automation Name"], it["Tools Expected"]].join(" ").toLowerCase().includes(q)));
    if (!rows.length) { document.getElementById("list").innerHTML = '<p class="subtitle">' + (items.length ? "Nothing matches." : "No requirements submitted yet.") + "</p>"; return; }
    let h = "<table><tr><th>ID</th><th>Requester</th><th>Dept</th><th>Request</th><th>Hrs/mo</th><th>Status</th><th>Score</th><th>With</th><th></th></tr>";
    rows.forEach((it) => {
      const owner = it["Status"] === "Scoring" ? it["Scored By"] : (["In build", "Awaiting requester validation"].includes(it["Status"]) ? it["Builder"] : "");
      h += "<tr><td>" + escapeHtml(it["Requirement ID"]) + "</td><td>" + escapeHtml(it["Submitted By"]) + "</td><td>" + escapeHtml(it["Department"]) + "</td>" +
        '<td style="max-width:280px;">' + escapeHtml(short(it["Process Explanation"], 110)) + "</td><td>" + escapeHtml(it["Hours Per Month"]) + "</td>" +
        "<td>" + statusBadge(it["Status"]) + "</td>" +
        "<td>" + (it["Score"] !== "" && it["Score"] !== undefined ? escapeHtml(it["Score"]) + " " + escapeHtml(it["Priority Classification"]) + (it["Needs Review"] === "Yes" ? ' <span class="flag-review">Needs review</span>' : "") : "") + "</td>" +
        "<td>" + escapeHtml(owner || "") + "</td>" +
        '<td><button class="btn-sm" onclick="openDetail(\'' + escapeHtml(it["Requirement ID"]) + '\')">Open</button></td></tr>';
    });
    document.getElementById("list").innerHTML = h + "</table>";
  }

  // ───────────── detail ─────────────
  async function openDetail(id) {
    currentId = id;
    document.getElementById("detailPanel").classList.remove("hidden");
    document.getElementById("detailBody").innerHTML = '<p class="subtitle">Loading…</p>';
    await refresh();
  }
  function closeDetail() {
    document.getElementById("detailPanel").classList.add("hidden");
    apiFetch("/tracker/requirements").then((d) => { items = d.items || []; renderList(); }).catch(() => {});
  }
  async function refresh() {
    try {
      D = await apiFetch("/tracker/requirement?id=" + encodeURIComponent(currentId));
      if (isCommittee() && D.item["Status"] === "Publishing" && !departments.length) {
        try { departments = (await apiFetch("/tracker/departments")).departments || []; } catch (e) {}
      }
      render();
    } catch (err) { showErr("detailBody", err.message); }
  }

  // run an action, then reload the detail
  async function act(path, body, okMsg, errId) {
    try {
      const r = await post(path, Object.assign({ requirementId: currentId }, body || {}));
      if (okMsg) showToast(okMsg, "success");
      await refresh();
      return r;
    } catch (e) { showErr(errId || "actErr", e.message); return null; }
  }

  function render() {
    const it = D.item;
    let h = "<h2>" + escapeHtml(it["Requirement ID"]) + " " + statusBadge(it["Status"]) + "</h2>" + renderTracker(it.step);
    h += '<div id="actErr"></div>' + renderActions();
    h += renderRequest();
    if (D.rud) h += renderRud();
    h += driveBox() + filesBox();
    h += renderTimeline();
    document.getElementById("detailBody").innerHTML = h;
    if (document.getElementById("sBI")) previewScore();
  }

  function driveBox() {
    const it = D.item;
    if (!it["Folder Link"] && !it["RUD Link"] && !D.rud) return "";
    const a = (u, l) => '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener">' + l + "</a>";
    const rid = escapeHtml(it["Requirement ID"]);
    let h = '<div class="detail-section"><h3>Drive</h3><p class="dim" style="margin:0 0 8px;">The folder and the document live in the Committee Drive. The portal is the master copy; saving here refreshes the Drive document.</p><p style="margin:0 0 8px;">' +
      (it["Folder Link"] ? "Folder: " + a(it["Folder Link"], "open the requirement folder") : "Folder: not created yet") + "<br>" +
      (it["RUD Link"] ? "Document: " + a(it["RUD Link"], "open the RUD in Google Docs") : "Document: not created yet") + "</p>";
    h += '<div class="support-actions">';
    if (D.canDownloadRud) h += btn("Download PDF", "() => downloadRud('" + rid + "', 'pdf')", true) + btn("Download Word", "() => downloadRud('" + rid + "', 'docx')", true);
    if (isCommittee() && D.rud) h += btn("Sync to Drive now", "syncDrive", true);
    return h + "</div></div>";
  }
  function filesBox() {
    const it = D.item, files = D.files || [];
    const c = isCommittee();
    if (!files.length && !c) return "";
    const a = (u, l) => '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener">' + escapeHtml(l) + "</a>";
    let h = '<div class="detail-section"><h3>Files</h3>';
    h += files.length ? '<ul class="file-list">' + files.map((f) => "<li><strong>" + escapeHtml(f.type) + (f.version ? " v" + escapeHtml(f.version) : "") + "</strong> · " + a(f.link, f.name) +
      ' <span class="dim">· ' + escapeHtml(f.by) + ", " + escapeHtml(f.on) + (f.note ? " · " + escapeHtml(f.note) : "") + "</span></li>").join("") + "</ul>" : '<p class="dim" style="margin:0 0 6px;">No files yet.</p>';
    if (c) {
      if (D.canAttach) h += upRow("Input sample from the requester", "attach", "fIn", FILE_EXT_INPUT, true);
      if (D.canUploadTool) {
        h += upRow("Code (a new upload becomes the next version; the old one goes to the archive)", "code", "fCode", FILE_EXT_TOOL) +
          upRow("User guide (versioned the same way)", "guide", "fGuide", FILE_EXT_TOOL) +
          upRow("Sample output", "output", "fOut", FILE_EXT_TOOL, true, '<input type="text" id="fOutType" maxlength="20" placeholder="Output type, e.g. DailyReport" style="max-width:240px;">');
      } else if (it["Status"] !== "Live") {
        h += '<p class="dim" style="font-size:12px;margin:8px 0 0;">Code, user guide and output files are added once the tool is published, because their names use the department and tool codes.</p>';
      }
    }
    return h + '<div id="fileErr"></div></div>';
  }
  function upRow(label, kind, id, exts, multi, extra) {
    return '<div style="margin-top:10px;"><label for="' + id + '">' + label + "</label>" + (extra || "") +
      '<input type="file" id="' + id + '"' + (multi ? " multiple" : "") + ' accept="' + exts.map((e) => "." + e).join(",") + '">' +
      '<div class="support-actions">' + btn("Upload", "() => uploadPick('" + kind + "', '" + id + "')", true) + "</div></div>";
  }
  async function uploadPick(kind, id) {
    const files = Array.from(document.getElementById(id).files);
    if (!files.length) return showErr("fileErr", "Please pick a file first.");
    const bad = checkPicked(files, kind === "attach" ? FILE_EXT_INPUT : FILE_EXT_TOOL);
    if (bad) return showErr("fileErr", bad);
    const body = { files: await filesToPayload(files) };
    if (kind === "output") body.outputType = document.getElementById("fOutType").value.trim();
    if (kind !== "attach") body.kind = kind;
    await act(kind === "attach" ? "/requirements/attach" : "/tracker/files/upload", body, "Uploaded to Drive", "fileErr");
  }
  async function syncDrive() { await act("/tracker/drive/sync", {}, "Drive is up to date"); }

  function btn(label, onclick, secondary) { return '<button class="btn-sm' + (secondary ? " secondary" : "") + '" onclick="handleClick(this, ' + onclick + ')">' + label + "</button>"; }

  // ───────────── actions by stage ─────────────
  function renderActions() {
    const it = D.item, st = it["Status"], c = isCommittee();
    let h = "";
    const box = (title, body) => '<div class="detail-section"><h3>' + title + "</h3>" + body + "</div>";

    if (st === "Submitted" || st === "Under committee review") {
      h += box("Committee review", c
        ? '<p class="dim" style="margin:0 0 8px;">Read the request below, then accept it for scoring or decline it with a reason the requester will see.</p>' +
          '<div class="support-actions">' + (st === "Submitted" ? btn("Start review", "() => act('/tracker/requirements/review', {action:'start_review'}, 'Review started')", true) : "") +
          btn("Accept for scoring", "() => act('/tracker/requirements/review', {action:'accept'}, 'Accepted for scoring')") + "</div>" +
          '<label for="rejReason">Reason for not taking it forward</label><textarea id="rejReason" rows="2"></textarea>' +
          '<div class="support-actions">' + btn("Reject", "rejectIt", true) + "</div>"
        : '<p class="dim">Waiting for the Committee to review.</p>');
    }
    if (st === "Scoring") h += box("Scoring", renderScoring());
    if (st === "Score confirmed") {
      h += box("Next: the Requirement Understanding Document", c
        ? '<p class="dim" style="margin:0 0 8px;">Score confirmed (' + escapeHtml(it["Score"]) + "/100, " + escapeHtml(it["Priority Classification"]) + "). Start the document to record what we understood.</p>" +
          '<div class="support-actions">' + btn("Start the document", "() => act('/tracker/rud/start', {}, 'Document started')") +
          btn("Reopen scoring", "() => act('/tracker/scoring/reopen', {}, 'Scoring reopened')", true) + "</div>"
        : '<p class="dim">Waiting for the Committee to start the document.</p>');
    }
    if (st === "RUD draft" || st === "RUD under review") {
      const signedC = !!it["RUD Committee Sign-off"], signedR = it["RUD Requester Confirmed"] === "Yes";
      let body = '<p class="dim" style="margin:0 0 8px;">Version ' + escapeHtml(it["RUD Version"]) + ". " +
        (st === "RUD draft" ? "Only the Committee sees this until you send it for review." :
         "Committee sign-off: <strong>" + (signedC ? "done (" + escapeHtml(it["RUD Committee Sign-off"]) + ")" : "pending") + "</strong> · Requester confirmation: <strong>" + (signedR ? "done" : "pending") + "</strong>.") + "</p>";
      if (c) {
        body += '<div class="support-actions">';
        if (st === "RUD draft") body += btn("Send to requester for review", "sendForReview") + btn("Reopen scoring", "() => act('/tracker/scoring/reopen', {}, 'Scoring reopened')", true);
        else if (!signedC) body += btn("Sign off for the Committee", "() => act('/tracker/rud/signoff', {}, 'Signed off')");
        body += "</div>";
      }
      h += box("Document " + (st === "RUD draft" ? "(draft)" : "under review"), body);
    }
    if (st === "RUD signed off") {
      h += box("Ready to build", c
        ? '<p class="dim" style="margin:0 0 8px;">The document is signed off by the requester and the Committee.</p>' +
          (it["Needs Review"] === "Yes" ? '<div class="support-note"><span class="flag-review">Needs review before building</span> Data is not available or the rules are not clear. Make sure that is settled.<label class="check-row"><input type="checkbox" id="ackReview"> I have reviewed this and want to build</label></div>' : "") +
          '<div class="support-actions">' + btn("I will build this", "startBuild") + "</div>"
        : '<p class="dim">Waiting for a Committee member to take the build.</p>');
    }
    if (st === "In build") {
      if (c && D.youAreBuilder) {
        h += box("You are building this", '<p class="dim" style="margin:0 0 8px;">When it is ready, add the technical documentation. It is mandatory. Then the requester validates it.</p>' +
          '<label for="bLink">Link to the technical file (working https link)</label><input type="text" id="bLink" value="' + escapeHtml(it["Technical File Link"] || "") + '">' +
          '<label for="bNote">Final documentation note (what was built, where it is stored, how to maintain it)</label><textarea id="bNote" rows="3">' + escapeHtml(it["Final Documentation Note"] || "") + "</textarea>" +
          '<div class="support-actions">' + btn("Send to the requester for validation", "submitBuild") + "</div>");
      } else {
        h += box("In build", '<p class="dim" style="margin:0 0 8px;">Being built by <strong>' + escapeHtml(it["Builder"] || "?") + "</strong>.</p>" +
          (c ? '<div class="support-actions">' + btn("Take over the build", "() => act('/tracker/build/start', {takeOver:true}, 'You now own the build')", true) + "</div>" : ""));
      }
    }
    if (st === "Awaiting requester validation") {
      const w = it.daysWaiting === undefined ? 0 : it.daysWaiting;
      let body = '<p class="dim" style="margin:0 0 8px;">Waiting for ' + escapeHtml(it["Submitted By"]) + " to validate. Sent " + escapeHtml(it["Build Completed Date"]) + " (" + w + " day(s) ago). A reminder goes out at 3 days.</p>";
      if (c) {
        body += w >= D.validateProceedDays
          ? '<label for="pNote">No reply after ' + D.validateProceedDays + ' days. You may proceed; this note is kept on record.</label><textarea id="pNote" rows="2"></textarea><div class="support-actions">' + btn("Proceed without validation", "proceedIt", true) + "</div>"
          : '<p class="dim" style="margin:0;">You can proceed without the requester only after ' + D.validateProceedDays + " days.</p>";
      }
      h += box("Awaiting the requester", body);
    }
    if (st === "Publishing") {
      h += box("Publish to the Catalog", c ? publishForm() : '<p class="dim">Waiting for the Committee to publish.</p>');
    }
    if (st === "Live") {
      h += box("Live", "<p style=\"margin:0;\"><strong>" + escapeHtml(it["Automation Name"]) + "</strong> · " + escapeHtml(it["Tool Type"]) + " · " + escapeHtml(it["Tool Department"]) + " (" + escapeHtml(it["Department Code"]) + ")<br>" + nl(it["Brief Description"]) +
        "<br><span class=\"dim\">Catalog " + escapeHtml(it["Catalog ID"]) + " · live since " + escapeHtml(it["Date Live"]) + "</span></p>");
    }
    if (st === "Rejected") h += box("Not taken forward", "<p style=\"margin:0;\">" + nl(it["Rejection Reason"]) + "</p>");
    return h;
  }

  async function rejectIt() {
    const reason = document.getElementById("rejReason").value.trim();
    if (reason.length < 5) return showErr("actErr", "Please give a short reason; the requester will see it.");
    await act("/tracker/requirements/review", { action: "reject", reason }, "Not taken forward");
  }
  async function sendForReview() { await act("/tracker/rud/submit-review", {}, "Sent to the requester"); }
  async function startBuild() {
    const ack = document.getElementById("ackReview");
    await act("/tracker/build/start", { acknowledgeReview: ack ? ack.checked : false }, "You are building this");
  }
  async function submitBuild() {
    await act("/tracker/build/submit", { technicalLink: document.getElementById("bLink").value.trim(), finalNote: document.getElementById("bNote").value.trim() }, "Sent to the requester for validation");
  }
  async function proceedIt() { await act("/tracker/validation/proceed", { note: document.getElementById("pNote").value.trim() }, "Moved on to publishing"); }

  // ───────────── scoring ─────────────
  const BI_LABELS = ["", "1 · Minor", "2 · Small", "3 · Moderate", "4 · High", "5 · Critical to the business"];
  const TS_LABELS = ["", "1 · Under 4 hours a month", "2 · 4 to 9 hours", "3 · 10 to 19 hours", "4 · 20 to 39 hours", "5 · 40 hours or more"];
  function sel(id, labels, val, onchange) {
    return '<select id="' + id + '" onchange="previewScore()"><option value="">Select…</option>' + [1, 2, 3, 4, 5].map((n) => '<option value="' + n + '"' + (String(val) === String(n) ? " selected" : "") + ">" + labels[n] + "</option>").join("") + "</select>";
  }
  function yn(id, val) { return '<select id="' + id + '" onchange="previewScore()"><option value="">Select…</option><option' + (val === "Yes" ? " selected" : "") + ">Yes</option><option" + (val === "No" ? " selected" : "") + ">No</option></select>"; }
  function renderScoring() {
    const it = D.item, c = isCommittee();
    if (!it["Scored By Email"]) {
      return c ? '<p class="dim" style="margin:0 0 8px;">One Committee member fills the score after the team has discussed it. The others can view it and comment.</p><div class="support-actions">' + btn("I will fill the score", "() => act('/tracker/scoring/claim', {}, 'You are filling the score')") + "</div>"
               : '<p class="dim">Waiting for a Committee member to take the scoring.</p>';
    }
    if (c && D.youAreScorer) {
      return '<p class="dim" style="margin:0 0 6px;">You are filling this. Requester effort: ' + escapeHtml(it["Hours Per Month"]) + " hours a month.</p>" +
        '<div class="score-grid"><div><label>Business impact (×6)</label>' + sel("sBI", BI_LABELS, it["Business Impact"]) + "</div>" +
        "<div><label>Time saving (×6) · suggested " + it.suggestedTimeSaving + "</label>" + sel("sTS", TS_LABELS, it["Time Saving"] || it.suggestedTimeSaving) + "</div>" +
        "<div><label>Repetitive work? (15)</label>" + yn("sRep", it["Repetitive"]) + "</div>" +
        "<div><label>Data available? (15)</label>" + yn("sData", it["Data Available"]) + "</div>" +
        "<div><label>Rule based? (10)</label>" + yn("sRule", it["Rule Based"]) + "</div></div>" +
        '<div class="score-result" id="scorePreview"></div>' +
        '<div class="support-actions">' + btn("Save", "() => saveScore(false)", true) + btn("Save and confirm the score", "() => saveScore(true)") + btn("Release", "() => act('/tracker/scoring/release', {}, 'Released')", true) + "</div>";
    }
    const filled = it["Score"] !== "" && it["Score"] !== undefined;
    return '<p style="margin:0 0 6px;"><strong>' + escapeHtml(it["Scored By"]) + "</strong> is filling the score.</p>" +
      (filled ? '<div class="detail-grid"><div class="k">Business impact</div><div>' + escapeHtml(it["Business Impact"]) + '</div><div class="k">Time saving</div><div>' + escapeHtml(it["Time Saving"]) +
        '</div><div class="k">Repetitive / Data / Rules</div><div>' + escapeHtml(it["Repetitive"]) + " / " + escapeHtml(it["Data Available"]) + " / " + escapeHtml(it["Rule Based"]) +
        '</div><div class="k">Score</div><div><strong>' + escapeHtml(it["Score"]) + "/100 · " + escapeHtml(it["Priority Classification"]) + "</strong></div></div>" : '<p class="dim">Not filled in yet. Add your thoughts in the comments below.</p>') +
      (c ? '<div class="support-actions">' + btn("Release so I can take it", "() => act('/tracker/scoring/release', {}, 'Released')", true) + "</div>" : "");
  }
  function scoreVals() {
    const g = (id) => (document.getElementById(id) || {}).value || "";
    return { businessImpact: Number(g("sBI")) || 0, timeSaving: Number(g("sTS")) || 0, repetitive: g("sRep"), dataAvailable: g("sData"), ruleBased: g("sRule") };
  }
  function previewScore() {
    const s = scoreVals(), el = document.getElementById("scorePreview");
    if (!el) return;
    if (!(s.businessImpact && s.timeSaving && s.repetitive && s.dataAvailable && s.ruleBased)) { el.innerHTML = '<span class="dim">Fill all five to see the score.</span>'; return; }
    const sc = s.businessImpact * 6 + s.timeSaving * 6 + (s.repetitive === "Yes" ? 15 : 0) + (s.dataAvailable === "Yes" ? 15 : 0) + (s.ruleBased === "Yes" ? 10 : 0);
    const pr = sc >= 75 ? "High" : sc >= 50 ? "Medium" : "Low";
    el.innerHTML = "Score: <strong>" + sc + "/100 · " + pr + "</strong>" + (s.dataAvailable === "No" || s.ruleBased === "No" ? ' <span class="flag-review">Needs review before building</span>' : "");
  }
  async function saveScore(confirm) {
    try {
      const r = await post("/tracker/scoring/save", Object.assign({ requirementId: currentId }, scoreVals()));
      if (confirm) {
        if (!r.complete) return showErr("actErr", "Fill all five scoring points first.");
        await post("/tracker/scoring/confirm", { requirementId: currentId });
        showToast("Score confirmed", "success");
      } else showToast("Saved", "success");
      await refresh();
    } catch (e) { showErr("actErr", e.message); }
  }

  // ───────────── request details ─────────────
  function renderRequest() {
    const it = D.item;
    return '<div class="detail-section"><h3>The request</h3><div class="detail-grid">' +
      '<div class="k">Requester</div><div>' + escapeHtml(it["Submitted By"]) + " (" + escapeHtml(it["Employee ID"]) + ", " + escapeHtml(it["Department"]) + ") · " + escapeHtml(it["Submission Date"]) + "</div>" +
      '<div class="k">Tools expected</div><div>' + escapeHtml(it["Tools Expected"]) + (it["Other Tool"] ? " (" + escapeHtml(it["Other Tool"]) + ")" : "") + "</div>" +
      '<div class="k">How it works today</div><div>' + nl(it["Process Explanation"]) + "</div>" +
      '<div class="k">Pain point</div><div>' + nl(it["Pain Point"]) + "</div>" +
      '<div class="k">Effort</div><div>' + escapeHtml(it["Time Per Occurrence (min)"]) + " min × " + escapeHtml(it["Times Per Month"]) + " a month (" + escapeHtml(it["Frequency"]) + ") = <strong>" + escapeHtml(it["Hours Per Month"]) + " hours a month</strong></div>" +
      (it["Reference Link"] ? '<div class="k">Reference</div><div><a href="' + escapeHtml(it["Reference Link"]) + '" target="_blank" rel="noopener">Open link</a></div>' : "") +
      (it["Technical File Link"] ? '<div class="k">Technical file</div><div><a href="' + escapeHtml(it["Technical File Link"]) + '" target="_blank" rel="noopener">Open link</a><br>' + nl(it["Final Documentation Note"]) + "</div>" : "") +
      (it["Builder"] ? '<div class="k">Builder</div><div>' + escapeHtml(it["Builder"]) + "</div>" : "") +
      "</div></div>";
  }

  // ───────────── RUD ─────────────
  function renderRud() {
    const r = D.rud, st = D.item["Status"];
    const editable = isCommittee() && ["RUD draft", "RUD under review", "RUD signed off"].includes(st);
    let h = '<div class="detail-section"><h3>Requirement Understanding Document · v' + escapeHtml(r.version) + " · " + escapeHtml(r.status) + "</h3>";
    if (editable && st !== "RUD draft") h += '<div class="support-note">Saving changes now creates a new version and asks the requester and the Committee to confirm again.</div>';
    let part = "";
    r.sections.forEach((s) => {
      if (s.part !== part) { part = s.part; h += '<div class="rud-sec"><div class="rs-part">' + escapeHtml(part) + "</div></div>"; }
      h += '<div class="rud-sec"><h4>' + escapeHtml(s.title) + '</h4>' +
        (editable ? '<div class="dim" style="font-size:12px;margin-bottom:3px;">' + escapeHtml(s.hint) + '</div><textarea data-rud="' + s.key + '" rows="4">' + escapeHtml(s.content) + "</textarea>"
                  : '<div class="rs-body">' + (s.content ? nl(s.content) : '<span class="dim">Empty</span>') + "</div>") + "</div>";
    });
    if (editable) h += '<div class="support-actions no-print">' + btn(st === "RUD draft" ? "Save draft" : "Save as a new version", "saveRud") + btn("Print or save as PDF", "() => { window.print(); return Promise.resolve(); }", true) + "</div>";
    else h += '<div class="support-actions no-print">' + btn("Print or save as PDF", "() => { window.print(); return Promise.resolve(); }", true) + "</div>";
    return h + "</div>";
  }
  async function saveRud() {
    const sections = {};
    document.querySelectorAll("textarea[data-rud]").forEach((t) => { sections[t.dataset.rud] = t.value; });
    await act("/tracker/rud/save", { sections }, "Document saved");
  }

  // ───────────── publish ─────────────
  function publishForm() {
    const it = D.item;
    return '<p class="dim" style="margin:0 0 8px;">The requester validated it. Add what the team will see in the Catalog.</p>' +
      '<label for="pName">Automation name</label><input type="text" id="pName" maxlength="80" oninput="suggestCode()">' +
      '<label for="pTool">Tool code (3 to 20 letters or digits, used in file names; you can edit it)</label><input type="text" id="pTool" maxlength="20" placeholder="e.g. AttendanceMerger" oninput="this.dataset.edited=1">' +
      '<div class="form-grid"><div><label for="pDept">Department this tool belongs to</label><input type="text" id="pDept" list="deptList" oninput="deptCheck()" autocomplete="off">' +
      '<datalist id="deptList">' + departments.map((d) => '<option value="' + escapeHtml(d.name) + '">' + escapeHtml(d.code) + "</option>").join("") + "</datalist></div>" +
      '<div><label for="pType">Tool type</label><select id="pType"><option value="">Select…</option>' + D.toolTypes.map((t) => "<option" + (it["Tools Expected"] === t ? " selected" : "") + ">" + escapeHtml(t) + "</option>").join("") + "</select></div></div>" +
      '<div id="pCodeWrap" class="hidden"><label for="pCode">New department: short code (2 to 5 letters, e.g. HR, FIN)</label><input type="text" id="pCode" maxlength="5" style="text-transform:uppercase;"></div>' +
      '<label for="pBrief">Brief description</label><textarea id="pBrief" rows="3" maxlength="400" placeholder="What the tool does, in a line or two"></textarea>' +
      '<div class="form-grid"><div><label for="pCodeFile">Code file (optional)</label><input type="file" id="pCodeFile" accept="' + FILE_EXT_TOOL.map((e) => "." + e).join(",") + '"></div>' +
      '<div><label for="pGuideFile">User guide (optional)</label><input type="file" id="pGuideFile" accept="' + FILE_EXT_TOOL.map((e) => "." + e).join(",") + '"></div></div>' +
      '<p class="dim" style="font-size:12px;margin:4px 0 0;">The technical file link and final note are already recorded. Files are saved to Drive with the standard name once published.</p>' +
      '<div class="support-actions">' + btn("Publish to the Catalog", "publishIt") + "</div>";
  }
  function suggestCode() {
    const c = document.getElementById("pTool");
    if (c.dataset.edited) return;
    c.value = document.getElementById("pName").value.replace(/[^A-Za-z0-9 ]+/g, " ").split(/\s+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join("").slice(0, 20);
  }
  function deptCheck() {
    const v = document.getElementById("pDept").value.trim().toLowerCase();
    document.getElementById("pCodeWrap").classList.toggle("hidden", !v || departments.some((d) => d.name.toLowerCase() === v));
  }
  async function publishIt() {
    const g = (id) => document.getElementById(id).value.trim();
    const pf = [["code", "pCodeFile"], ["guide", "pGuideFile"]].map(([k, id]) => [k, document.getElementById(id).files[0]]).filter((x) => x[1]);
    for (const [, f] of pf) { const bad = checkPicked([f], FILE_EXT_TOOL); if (bad) return showErr("actErr", bad); }
    const r = await act("/tracker/publish", { automationName: g("pName"), toolCode: g("pTool"), toolDepartment: g("pDept"), toolType: g("pType"), briefDescription: g("pBrief"), departmentCode: g("pCode") }, "Published. It is live in the Catalog.");
    if (!r) return;
    for (const [kind, f] of pf) {
      try { await post("/tracker/files/upload", { requirementId: currentId, kind, files: await filesToPayload([f]) }); showToast(f.name + " saved to Drive", "success"); }
      catch (e) { showToast("Published, but " + f.name + " was not saved: " + e.message + " Add it under Files.", "error"); }
    }
    if (pf.length) await refresh();
  }

  // ───────────── timeline + comments ─────────────
  function renderTimeline() {
    const c = isCommittee();
    let h = '<div class="detail-section"><h3>Timeline and comments</h3><div class="thread-box">' +
      (D.updates.length ? D.updates.slice().reverse().map((u) =>
        '<div class="update-item' + (u.visibility === "Team only" ? " internal" : "") + '"><div class="u-meta">' + escapeHtml(u.date) + " · " + escapeHtml(u.by) + " (" + escapeHtml(u.role) + ") · " + escapeHtml(u.type) +
        (u.visibility === "Team only" ? " · team only" : "") + "</div>" + nl(u.message) + "</div>").join("") : '<p class="dim">Nothing yet.</p>') + "</div>";
    h += '<label for="cMsg">' + (c ? "Add a comment" : "Add a team-only note") + '</label><textarea id="cMsg" rows="2"></textarea>';
    if (c) h += '<label class="check-row"><input type="checkbox" id="cInternal" checked> Team only (the requester will not see it)</label>';
    h += '<div class="support-actions">' + btn("Post", "postComment") + '</div><div id="cErr"></div></div>';
    return h;
  }
  async function postComment() {
    const m = document.getElementById("cMsg").value.trim();
    if (!m) return showErr("cErr", "Please write something first.");
    const internal = !isCommittee() || document.getElementById("cInternal").checked;
    try { await post("/requirements/comment", { requirementId: currentId, message: m, internal }); showToast("Posted", "success"); await refresh(); }
    catch (e) { showErr("cErr", e.message); }
  }

  load();
</script>
</body>
</html>
