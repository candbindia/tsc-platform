<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automation Catalog — TSC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="content">
  <h1>Automation Catalog</h1>
  <p class="subtitle">Automations already live. "Open" items link straight through. "On Request" items route a request to the owner — nothing is downloadable directly.</p>

  <div id="list"></div>
  <div id="messageBox"></div>
</div>

<!-- Deployment request modal (simple inline panel, not a real modal) -->
<div class="page hidden" id="requestPanel" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); margin:0; max-width:none; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="max-width:420px; width:90%;">
    <h2 id="requestTitle">Request deployment</h2>
    <label for="intendedUse">What will you use this for?</label>
    <textarea id="intendedUse" rows="3" placeholder="e.g. For the Mumbai branch's weekly reconciliation"></textarea>
    <button onclick="submitDeploymentRequest()">Send request</button>
    <button class="secondary" onclick="closeRequestPanel()">Cancel</button>
    <div id="requestMessage"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
  let currentCatalogId = null;

  async function load() {
    const session = renderTopbar();
    if (!session) return;

    try {
      const data = await apiFetch("/catalog");
      renderList(data.items || []);
    } catch (err) {
      document.getElementById("messageBox").innerHTML = '<div class="error">' + escapeHtml(err.message) + "</div>";
    }
  }

  function renderList(items) {
    if (!items.length) {
      document.getElementById("list").innerHTML = '<p class="subtitle">Nothing in the catalog yet.</p>';
      return;
    }

    let html = "<table><tr><th>Automation</th><th>Department</th><th>Description</th><th>Status</th><th>Access</th></tr>";
    items.forEach((it) => {
      const isOpen = (it["Access Type"] || "").trim() === "Open";
      let accessCell;
      if (isOpen && it["Access Link / Instructions"]) {
        accessCell = '<a href="' + escapeHtml(it["Access Link / Instructions"]) + '" target="_blank">Open link</a>';
      } else if (isOpen) {
        accessCell = '<span class="badge">Open</span>';
      } else {
        accessCell =
          '<button style="width:auto; margin:0; padding:6px 10px; font-size:13px;" onclick="openRequestPanel(\'' +
          escapeHtml(it["Catalog ID"]) +
          "', '" +
          escapeHtml(it["Automation Name"]) +
          "')\">Request access</button>";
      }

      html +=
        "<tr><td>" +
        escapeHtml(it["Automation Name"]) +
        "</td><td>" +
        escapeHtml(it["Department / Function"]) +
        "</td><td>" +
        escapeHtml(it["Description"]) +
        '</td><td><span class="badge">' +
        escapeHtml(it["Status"]) +
        "</span></td><td>" +
        accessCell +
        "</td></tr>";
    });
    html += "</table>";
    document.getElementById("list").innerHTML = html;
  }

  function openRequestPanel(catalogId, name) {
    currentCatalogId = catalogId;
    document.getElementById("requestTitle").textContent = "Request access: " + name;
    document.getElementById("intendedUse").value = "";
    document.getElementById("requestMessage").innerHTML = "";
    document.getElementById("requestPanel").classList.remove("hidden");
  }

  function closeRequestPanel() {
    document.getElementById("requestPanel").classList.add("hidden");
  }

  async function submitDeploymentRequest() {
    const intendedUse = document.getElementById("intendedUse").value.trim();
    try {
      const data = await apiFetch("/catalog/deployment-request", {
        method: "POST",
        body: JSON.stringify({ catalogId: currentCatalogId, intendedUse }),
      });
      document.getElementById("requestMessage").innerHTML =
        '<div class="success">Request sent to ' + escapeHtml(data.routedTo) + ". They'll reach out to you directly.</div>";
    } catch (err) {
      document.getElementById("requestMessage").innerHTML = '<div class="error">' + escapeHtml(err.message) + "</div>";
    }
  }

  load();
</script>
</body>
</html>
