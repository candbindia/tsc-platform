<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automation Catalog — TSC</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="content">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
    <div class="ic" id="icHeader" style="width:36px; height:36px;"></div>
    <h1 style="margin:0;">Automation Catalog</h1>
  </div>
  <p class="subtitle">Automations that are already live. To use one, or to ask about it, please contact a Committee member.</p>

  <div style="margin-bottom:4px;">
    <input type="text" id="searchBox" placeholder="Search by name, tool type, department or description…" oninput="applyFilter()" style="max-width:380px;">
  </div>

  <div id="list" class="catalog-grid"></div>
  <div id="messageBox"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="toast.js"></script>
<script src="nav.js"></script>
<script>
  let allItems = [];
  const session = renderTopbar();
  const isStaff = !!session && session.role !== "employee";
  document.getElementById("icHeader").innerHTML = icon("archive", 20);

  function fixLink(v) {
    let s = (v || "").toString().trim();
    if (!s) return "";
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = "https://" + s.replace(/^\/+/, "");
    return /^https?:\/\//i.test(s) ? s : "";
  }

  async function load() {
    if (!guardRoles(session, ["employee", "Committee", "Management"])) return;
    try {
      const data = await apiFetch("/catalog");
      allItems = data.items || [];
      renderList(allItems);
    } catch (err) {
      document.getElementById("messageBox").innerHTML = '<div class="error"></div>';
      document.getElementById("messageBox").firstChild.textContent = err.message;
    }
  }

  function applyFilter() {
    const q = document.getElementById("searchBox").value.trim().toLowerCase();
    renderList(!q ? allItems : allItems.filter((it) =>
      [it["Automation Name"], it["Tool Type"], it["Tool Department"], it["Brief Description"]].join(" ").toLowerCase().includes(q)));
  }

  function renderList(items) {
    if (!items.length) {
      document.getElementById("list").innerHTML = '<p class="subtitle">' + (allItems.length ? "Nothing matches your search." :
        "No automations are listed yet. They appear here as soon as the Committee publishes them.") + "</p>";
      return;
    }
    document.getElementById("list").innerHTML = items.map((it) => {
      let tech = "";
      if (isStaff) {
        const tl = fixLink(it["Technical File Link"]);
        tech = tl
          ? '<div class="cc-tech"><a href="' + escapeHtml(tl) + '" rel="noopener" target="_blank">' + icon("external-link", 11) + " Technical file</a></div>"
          : '<div class="cc-tech missing">' + icon("warning", 11) + " Documentation missing</div>";
      }
      return '<div class="catalog-card"><div class="cc-icon">' + icon("bolt", 20) + "</div>" +
        '<div class="cc-title">' + escapeHtml(it["Automation Name"]) + "</div>" +
        '<div class="cc-dept">' + icon("building", 11) + " " + escapeHtml(it["Tool Department"] || "") + " · " + escapeHtml(it["Tool Type"] || "") + "</div>" +
        '<div class="cc-desc">' + escapeHtml(it["Brief Description"]) + "</div>" +
        '<div class="cc-footer"><span class="badge">' + escapeHtml(it["Status"] || "Active") + '</span><span class="dim" style="font-size:12px;">Contact a Committee member</span></div>' + tech + "</div>";
    }).join("");
  }

  load();
</script>
</body>
</html>
