<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Requests — TSC</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="content" style="max-width:860px;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
    <div class="ic" id="icHeader" style="width:36px; height:36px;"></div>
    <h1 style="margin:0;">My Requests</h1>
  </div>
  <p class="subtitle">Everything you have submitted and where it stands. When we need something from you, it is marked <span class="needs-you">Needs you</span>.</p>
  <div id="list"></div>
  <div id="messageBox"></div>
</div>

<div class="modal-overlay hidden" id="detailPanel">
  <div class="card xl-modal">
    <div id="detailBody"><p class="subtitle">Loading…</p></div>
    <button class="secondary no-print" onclick="closeDetail()" style="margin-top:14px;">Close</button>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="toast.js"></script>
<script src="status.js"></script>
<script src="nav.js"></script>
<script>
  const session = renderTopbar();
  let currentId = null, lastDetail = null, showFull = false;
  if (guardRoles(session, ["employee"])) { document.getElementById("icHeader").innerHTML = icon("check-square", 20); loadList(); }

  const short = (t, n) => { t = (t || "").toString(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
  const nl = (t) => escapeHtml(t).replace(/\n/g, "<br>");

  async function loadList() {
    try {
      const data = await apiFetch("/requirements/mine");
      const items = data.items || [];
      if (!items.length) {
        document.getElementById("list").innerHTML = '<div class="card"><p class="subtitle" style="margin:0;">You have not submitted anything yet. <a href="portal-submit.html">Submit a requirement</a>.</p></div>';
        return;
      }
      document.getElementById("list").innerHTML = items.map((it) =>
        '<div class="card req-card" onclick="openDetail(\'' + escapeHtml(it["Requirement ID"]) + '\')">' +
        '<div class="rc-top"><span class="rc-id">' + escapeHtml(it["Requirement ID"]) + "</span><span>" +
        (it.needsYou ? '<span class="needs-you">Needs you</span> ' : "") + statusBadgeEmp(it) + "</span></div>" +
        '<p style="margin:8px 0 4px;">' + escapeHtml(short(it["Process Explanation"], 160)) + "</p>" +
        '<div class="dim" style="font-size:12px;">Submitted ' + escapeHtml(it["Submission Date"]) + " · about " + escapeHtml(it["Hours Per Month"]) + " hours a month</div>" +
        (it.step >= 0 ? renderTracker(it.step) : "") +
        (it["Status"] === "Live" ? '<div style="margin-top:8px;"><strong>' + escapeHtml(it["Automation Name"]) + "</strong> is live.</div>" : "") +
        "</div>").join("");
    } catch (err) {
      document.getElementById("messageBox").innerHTML = '<div class="error"></div>';
      document.getElementById("messageBox").firstChild.textContent = err.message;
    }
  }

  // Employees see a simple label, not the internal status names.
  function statusBadgeEmp(it) {
    const labels = ["Submitted", "In review", "Scored", "Document ready", "In build", "Live"];
    if (it["Status"] === "Rejected") return statusBadge("Rejected").replace("Rejected", "Not taken forward");
    return statusBadge(it["Status"]).replace(/>[^<]*</, ">" + escapeHtml(labels[it.step] || it["Status"]) + "<");
  }

  async function openDetail(id) {
    currentId = id; showFull = false;
    document.getElementById("detailPanel").classList.remove("hidden");
    document.getElementById("detailBody").innerHTML = '<p class="subtitle">Loading…</p>';
    await refreshDetail();
  }
  function closeDetail() { document.getElementById("detailPanel").classList.add("hidden"); loadList(); }

  async function refreshDetail() {
    try {
      lastDetail = await apiFetch("/requirements/detail?id=" + encodeURIComponent(currentId));
      renderDetail();
    } catch (err) {
      document.getElementById("detailBody").innerHTML = '<div class="error"></div>';
      document.getElementById("detailBody").firstChild.textContent = err.message;
    }
  }

  function renderDetail() {
    const d = lastDetail, it = d.item;
    let h = "<h2>" + escapeHtml(it["Requirement ID"]) + " " + statusBadgeEmp(it) + "</h2>";
    h += renderTracker(it.step);
    if (it["Status"] === "Rejected") h += '<div class="support-note"><strong>Not taken forward.</strong><br>' + nl(it["Rejection Reason"]) + "<br><span class=\"dim\">You are welcome to submit it again with more detail, or talk to a Committee member.</span></div>";
    if (it["Status"] === "Live") h += '<div class="support-note"><strong>' + escapeHtml(it["Automation Name"]) + "</strong> (" + escapeHtml(it["Tool Type"]) + ") is live.<br>" + nl(it["Brief Description"]) + '<br><span class="dim">You will find it in the Catalog. To use it, contact a Committee member.</span></div>';

    if (d.canValidate) {
      h += '<div class="detail-section"><h3>Your check is needed</h3><div class="support-note">Your automation is ready. Please try it with your real work and tell us if it is right. Only you can validate it, so we wait for you.</div>' +
        '<label for="vMsg">Message (needed if you send it back)</label><textarea id="vMsg" rows="2" placeholder="What should be changed?"></textarea>' +
        '<div class="support-actions"><button class="btn-sm" onclick="handleClick(this, () => validate(\'approve\'))">Validate: it works</button>' +
        '<button class="btn-sm secondary" onclick="handleClick(this, () => validate(\'send_back\'))">Send back</button></div><div id="vErr"></div></div>';
    }

    if (d.rud) h += renderRud(d);

    h += '<div class="detail-section"><h3>Your request</h3><div class="detail-grid">' +
      '<div class="k">Tools expected</div><div>' + escapeHtml(it["Tools Expected"]) + (it["Other Tool"] ? " (" + escapeHtml(it["Other Tool"]) + ")" : "") + "</div>" +
      '<div class="k">How it works today</div><div>' + nl(it["Process Explanation"]) + "</div>" +
      '<div class="k">Pain point</div><div>' + nl(it["Pain Point"]) + "</div>" +
      '<div class="k">Effort</div><div>' + escapeHtml(it["Time Per Occurrence (min)"]) + " min, " + escapeHtml(it["Frequency"]) + " (about " + escapeHtml(it["Hours Per Month"]) + " hours a month)</div>" +
      (it["Reference Link"] ? '<div class="k">Reference</div><div><a href="' + escapeHtml(it["Reference Link"]) + '" target="_blank" rel="noopener">Open link</a></div>' : "") +
      "</div></div>";

    h += '<div class="detail-section"><h3>Messages and progress</h3><div class="thread-box">' +
      (d.updates.length ? d.updates.slice().reverse().map((u) =>
        '<div class="update-item"><div class="u-meta">' + escapeHtml(u.date) + " · " + escapeHtml(u.by) + " (" + escapeHtml(u.role) + ") · " + escapeHtml(u.type) + "</div>" + nl(u.message) + "</div>").join("")
        : '<p class="dim">Nothing yet.</p>') + "</div>";
    if (it["Status"] !== "Rejected") {
      h += '<label for="cMsg">Write to the Committee</label><textarea id="cMsg" rows="2" placeholder="A question or a note"></textarea>' +
        '<div class="support-actions"><button class="btn-sm" onclick="handleClick(this, comment)">Send</button></div><div id="cErr"></div>';
    }
    h += "</div>";
    document.getElementById("detailBody").innerHTML = h;
  }

  function renderRud(d) {
    const r = d.rud;
    let h = '<div class="detail-section"><h3>Requirement Understanding Document (v' + escapeHtml(r.version) + ")</h3>" +
      '<p class="dim" style="font-size:12.5px; margin:0 0 8px;">This is what we understood and plan to build. ' +
      (r.requesterConfirmed ? "You confirmed it on " + escapeHtml(r.requesterConfirmedOn) + "." : "Please read it carefully.") +
      (r.committeeSignedBy ? " Signed off by the Committee (" + escapeHtml(r.committeeSignedBy) + ", " + escapeHtml(r.committeeSignedOn) + ")." : "") + "</p>";
    if (!showFull) {
      h += (r.summary.length ? r.summary.map((s) => '<div class="rud-sec"><h4>' + escapeHtml(s.title) + '</h4><div class="rs-body">' + nl(s.text) + "</div></div>").join("") : "") +
        '<div class="support-actions no-print"><button class="btn-sm secondary" onclick="showFull=true; renderDetail()">Read the full document</button></div>';
    } else {
      let part = "";
      r.sections.forEach((s) => {
        if (s.part !== part) { part = s.part; h += '<div class="rs-part rud-sec"><div class="rs-part">' + escapeHtml(part) + "</div></div>"; }
        h += '<div class="rud-sec"><h4>' + escapeHtml(s.title) + '</h4><div class="rs-body">' + nl(s.content) + "</div></div>";
      });
      h += '<div class="support-actions no-print"><button class="btn-sm secondary" onclick="showFull=false; renderDetail()">Show the summary</button>' +
        '<button class="btn-sm secondary" onclick="printRud()">Print or save as PDF</button></div>';
    }
    if (d.canConfirmRud) {
      h += '<div class="no-print" style="margin-top:12px;"><label for="rMsg">Message (needed if you ask for a correction)</label><textarea id="rMsg" rows="2" placeholder="What should be corrected?"></textarea>' +
        '<div class="support-actions"><button class="btn-sm" onclick="handleClick(this, () => rudRespond(\'confirm\'))">Confirm this understanding</button>' +
        '<button class="btn-sm secondary" onclick="handleClick(this, () => rudRespond(\'correction\'))">Request a correction</button></div><div id="rErr"></div></div>';
    }
    return h + "</div>";
  }

  function printRud() {
    const r = lastDetail.rud, it = lastDetail.item;
    const w = window.open("", "_blank");
    if (!w) { showToast("Allow pop-ups to print the document.", "error"); return; }
    let body = "<h1>Requirement Understanding Document</h1><p>" + escapeHtml(it["Requirement ID"]) + " · version " + escapeHtml(r.version) + " · " + escapeHtml(r.status) + "</p><p>Requester: " + escapeHtml(r.requester) + " (" + escapeHtml(r.department) + ")</p>";
    let part = "";
    r.sections.forEach((s) => {
      if (s.part !== part) { part = s.part; body += "<h2>" + escapeHtml(part) + "</h2>"; }
      body += "<h3>" + escapeHtml(s.title) + "</h3><p style='white-space:pre-wrap'>" + escapeHtml(s.content) + "</p>";
    });
    w.document.write("<html><head><title>" + escapeHtml(it["Requirement ID"]) + " RUD</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:30px auto;color:#222}h1{border-bottom:3px solid #f2ac3c;padding-bottom:8px}h2{background:#646767;color:#fff;padding:6px 10px;font-size:15px}h3{font-size:14px;margin-bottom:2px}</style></head><body>" + body + "</body></html>");
    w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
  }

  async function post(path, body) { return apiFetch(path, { method: "POST", body: JSON.stringify(body) }); }
  function err(id, m) { const el = document.getElementById(id); if (el) { el.innerHTML = '<div class="error"></div>'; el.firstChild.textContent = m; } }

  async function comment() {
    const m = document.getElementById("cMsg").value.trim();
    if (!m) return err("cErr", "Please write something first.");
    try { await post("/requirements/comment", { requirementId: currentId, message: m }); showToast("Sent to the Committee.", "success"); await refreshDetail(); }
    catch (e) { err("cErr", e.message); }
  }
  async function rudRespond(action) {
    const m = (document.getElementById("rMsg") || {}).value || "";
    try {
      await post("/requirements/rud-response", { requirementId: currentId, action, message: m.trim() });
      showToast(action === "confirm" ? "Thank you, confirmed." : "Correction request sent.", "success");
      await refreshDetail();
    } catch (e) { err("rErr", e.message); }
  }
  async function validate(decision) {
    const m = (document.getElementById("vMsg") || {}).value || "";
    try {
      await post("/requirements/validate", { requirementId: currentId, decision, message: m.trim() });
      showToast(decision === "approve" ? "Thank you, validated." : "Sent back to the Committee.", "success");
      await refreshDetail();
    } catch (e) { err("vErr", e.message); }
  }
</script>
</body>
</html>
