<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help — TSC</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="content" style="max-width:760px;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
    <div class="ic" id="icHeader" style="width:36px; height:36px;"></div>
    <h1 style="margin:0;">How TSC Works</h1>
  </div>
  <p class="subtitle">The Technology Spearheads Committee turns manual, repetitive work into automation — here is the journey a requirement takes from idea to live, in 8 steps.</p>

  <button class="secondary" style="width:auto; padding:9px 16px;" onclick="restartTour()">
    <span id="icReplay"></span> Replay the guided tour
  </button>

  <div class="card" style="margin-top:20px;">
    <h2>The 8-step journey</h2>
    <div class="step-list" id="steps"></div>
  </div>

  <div class="card" style="margin-top:20px;">
    <h2>Frequently asked</h2>
    <div id="faq"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="icons.js"></script>
<script src="nav.js"></script>
<script src="tour.js"></script>
<script>
  const session = renderTopbar();
  document.getElementById("icHeader").innerHTML = icon("book", 20);
  document.getElementById("icReplay").innerHTML = icon("sparkle", 13);

  const STEPS = [
    { icon: "plus-circle", title: "1. You submit a requirement", text: "Tell us the tools you expect, how the process works today, the pain point, and roughly how long it takes and how often. Add a link to a sample if you have one." },
    { icon: "user-check", title: "2. Committee review", text: "A Committee member reviews it. If it is not taken forward, you see the reason and can submit again with more detail." },
    { icon: "gauge", title: "3. Scoring", text: "The Committee discusses and scores it internally to decide priority. You do not need to do anything here." },
    { icon: "book", title: "4. We write down what we understood", text: "The Committee prepares a Requirement Understanding Document: what you asked, what we understood and what we will build. You read it under My Requests and confirm it or ask for a correction." },
    { icon: "check-circle", title: "5. Sign-off", text: "Building starts only after both you and the Committee have signed off the document. If anything changes later, a new version is made and you confirm again." },
    { icon: "bolt", title: "6. Build", text: "A Committee member builds the automation and records the technical documentation." },
    { icon: "shield", title: "7. You validate", text: "When it is ready, you try it and validate it or send it back with what to change. Only you can validate it. If we do not hear back, we remind you after 3 days." },
    { icon: "rocket", title: "8. Live", text: "The Committee publishes it in the Automation Catalog with a name, tool type and short description. To use it, contact a Committee member." },
  ];

  const FAQ = [
    { q: "What happens right after I submit a requirement?", a: "It goes to the Committee. You will see it under My Requests, and we email you at your work email at the important points." },
    { q: "Who can see my requirement and its score?", a: "Only you, the Committee and Management can see your requirement. The score is internal to the Committee and Management, you do not see it." },
    { q: "What is the Requirement Understanding Document?", a: "A short document that records what you asked for and what we understood and plan to build, so both sides agree before building starts. You can read a summary or the full document, print it, ask for a correction, or confirm it." },
    { q: "Why do I have to validate the automation?", a: "You know the work best. Only you can say whether it does the job. If something is off, send it back with a note and we fix it." },
    { q: "I need help from the Technology team (not an automation idea): where do I go?", a: "Use Support, then Raise a Support Request. It is for day-to-day help such as a change to a sheet or tool, a new report, or something not working." },
    { q: "Can I use an automation from the Catalog?", a: "The Catalog shows what is live. To use one or ask about it, please contact a Committee member." },
    { q: "My CABIES ID isn't recognized, or I forgot my password: what do I do?", a: "If your CABIES ID isn't recognized, check with HR that it is active. First time? We email a 6-digit code to your work email so you can set a password. Forgot it? Ask a Committee member to reset it, then register again." },
    { q: "I'm Committee or Management: what can I do that CABIES can't?", a: "Committee members review, score, write the document, build and publish from the Requirement Register, and handle Support. Management can view everything and leave team-only notes. Admins manage accounts." },
  ];

  document.getElementById("steps").innerHTML = STEPS.map(
    (s) =>
      '<div class="step-item"><div class="step-num">' + icon(s.icon, 16) + "</div><div>" +
      '<div class="step-title">' + escapeHtml(s.title) + "</div>" +
      '<div class="step-desc">' + escapeHtml(s.text) + "</div></div></div>"
  ).join("");

  document.getElementById("faq").innerHTML = FAQ.map(
    (f, i) =>
      '<div class="faq-item" id="faq' + i + '"><div class="faq-q" onclick="toggleFaq(' + i + ')">' +
      "<span>" + escapeHtml(f.q) + '</span><span class="chev">' + icon("chevron-right", 14) + "</span></div>" +
      '<div class="faq-a">' + escapeHtml(f.a) + "</div></div>"
  ).join("");

  function toggleFaq(i) {
    document.getElementById("faq" + i).classList.toggle("open");
  }
</script>
</body>
</html>
